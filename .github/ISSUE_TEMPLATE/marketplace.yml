name: New marketplace
description: Ask to support another site
labels: [marketplace]
body:
  - type: input
    id: site
    attributes:
      label: Site
      placeholder: wildberries.ru
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What you want the agent to do there
      placeholder: Search products, compare prices, build a shareable list
    validations:
      required: true
